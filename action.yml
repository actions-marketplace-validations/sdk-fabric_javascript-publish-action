name: 'SDK-Fabric JavaScript Publish'
description: 'SDK-Fabric GitHub action to publish a JavaScript release'
branding:
  icon: 'upload'
  color: 'green'
inputs:
  typehub_version:
    description: 'The provided TypeHub version'
    required: true
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v6
      with:
        node-version: '24.x'
        registry-url: 'https://registry.npmjs.org'
        package-manager-cache: false
    - shell: bash
      run: npm version ${{ inputs.typehub_version }} --no-git-tag-version
    - shell: bash
      run: npm install
    - shell: bash
      run: node ./build_index.js
    - shell: bash
      run: npm run build
    - shell: bash
      run: npm publish
